name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Unit tests, lint, and types only. Integration/e2e tests need an unlocked interactive
    # desktop with WinApp CLI and are run manually (uv run pytest -m integration).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
